<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eltern-Dashboard – Milli Power Akademie</title>
<style>
  /* Bewusst immer hell, unabhängig vom Geräte-Dark-Mode - die Auswertung
     soll immer gut lesbar sein (dunkler Text auf weißem Grund). Auf :root
     definiert (statt auf einem inneren div), damit die Variablen an body
     und alle Elemente korrekt weitervererbt werden. */
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --card:           #ffffff;
    --seq-blue:       #2a78d6;
    --good:           #0ca30c;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;
    --nodata:         #d8d7d0;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--page);
    color:var(--text-primary);
    min-height:100vh;
  }
  #wrap{max-width:920px; margin:0 auto; padding:24px 18px 60px;}

  h1{font-size:1.6rem; margin:0 0 4px;}
  h2{font-size:1.15rem; margin:0 0 4px;}
  p.sub{color:var(--text-secondary); margin:0 0 24px; font-size:.95rem;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* Login / PIN gate */
  .auth-card{
    max-width:340px; margin:15vh auto 0; background:var(--card);
    border:1px solid var(--border); border-radius:16px; padding:28px 24px;
    text-align:center;
  }
  .auth-card input{
    font-size:1.1rem; text-align:center; width:100%;
    padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-1); color:var(--text-primary); margin-bottom:10px;
  }
  #pin-input{ font-size:1.6rem; letter-spacing:10px; margin-top:6px; }
  #pin-error, #login-error{color:var(--critical); font-size:.85rem; min-height:20px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    padding:10px 22px; font-size:1rem; font-weight:600;
    background:var(--seq-blue); color:#fff;
  }

  /* Cards / layout */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:20px;
  }
  .summary-card{
    background:linear-gradient(135deg, var(--seq-blue), #1c5cab);
    color:#fff; border-radius:16px; padding:20px 22px; margin-bottom:20px;
  }
  .summary-card h2{color:#fff;}
  .summary-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:14px; margin-top:12px;
  }
  .summary-tile{background:rgba(255,255,255,0.15); border-radius:12px; padding:12px 14px;}
  .summary-tile b{display:block; font-size:1.4rem;}
  .summary-tile span{font-size:.78rem; opacity:.9;}

  .tabs{display:flex; gap:8px; margin-bottom:18px;}
  .tab-btn{
    flex:1; background:var(--card); color:var(--text-secondary);
    border:1px solid var(--border); padding:10px; border-radius:10px; font-weight:700;
  }
  .tab-btn.active{background:var(--seq-blue); color:#fff; border-color:var(--seq-blue);}

  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px; margin-bottom:20px;
  }
  .stat-tile{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px;
  }
  .stat-tile b{display:block; font-size:1.6rem; font-variant-numeric:tabular-nums;}
  .stat-tile span{font-size:.8rem; color:var(--text-secondary);}

  svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .axis-label{fill:var(--muted); font-size:11px;}
  .value-label{fill:var(--text-primary); font-size:11px; font-weight:600;}
  .grid-line{stroke:var(--gridline); stroke-width:1;}
  .baseline{stroke:var(--baseline); stroke-width:1;}

  .bar-rect{cursor:pointer;}
  .tooltip{
    position:absolute; pointer-events:none; background:var(--text-primary);
    color:var(--surface-1); font-size:.8rem; padding:6px 10px; border-radius:8px;
    transform:translate(-50%,-115%); white-space:nowrap; opacity:0; transition:opacity .1s;
    z-index:10;
  }
  .chart-wrap{position:relative;}

  details.table-toggle{margin-top:8px;}
  details.table-toggle summary{
    cursor:pointer; font-size:.82rem; color:var(--text-secondary); user-select:none;
  }
  table.data-table{
    width:100%; border-collapse:collapse; margin-top:10px; font-size:.85rem;
  }
  table.data-table th, table.data-table td{
    text-align:left; padding:5px 8px; border-bottom:1px solid var(--gridline);
    font-variant-numeric:tabular-nums;
  }
  table.data-table th{color:var(--text-secondary); font-weight:600;}

  .weak-list{list-style:none; margin:0; padding:0;}
  .weak-list li{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--gridline); font-size:.92rem;
  }
  .weak-list li:last-child{border-bottom:none;}
  .weak-list .pct{font-variant-numeric:tabular-nums; font-weight:700; color:var(--critical);}
  .weak-list .pct.skip{color:var(--warning);}

  .insight-box{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:20px;
  }
  .insight-item{margin-bottom:14px;}
  .insight-item:last-child{margin-bottom:0;}
  .insight-item .title{font-weight:700; margin-bottom:3px;}
  .insight-item .detail{color:var(--text-secondary); font-size:.9rem; line-height:1.5;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-secondary);
  }
  .top-row{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;}
  .refresh-link{font-size:.82rem; color:var(--seq-blue); cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>
<div class="viz-root">
<div id="wrap">

  <!-- LOGIN (Supabase Auth) -->
  <div class="screen active" id="screen-login">
    <div class="auth-card">
      <div style="font-size:40px;">🐯🔒</div>
      <h2>Anmelden</h2>
      <p class="sub" style="margin-bottom:0;">Familien-Zugang eingeben.</p>
      <input id="login-username" type="text" placeholder="Benutzername" autocomplete="username" style="margin-top:16px;">
      <input id="login-password" type="password" placeholder="Passwort" autocomplete="current-password">
      <div id="login-error">&nbsp;</div>
      <button onclick="handleFamilyLogin()">Anmelden</button>
    </div>
  </div>

  <!-- PIN GATE -->
  <div class="screen" id="screen-pin">
    <div class="auth-card">
      <div style="font-size:40px;">🐯🔒</div>
      <h2>Eltern-Dashboard</h2>
      <p class="sub" style="margin-bottom:0;">Gib den PIN ein, um die Auswertung zu sehen.</p>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
      <div id="pin-error">&nbsp;</div>
      <button onclick="checkPin()">Entsperren</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="screen" id="screen-dashboard">
    <div class="top-row">
      <div>
        <h1>🐯 Milli Power Akademie – Auswertung</h1>
        <p class="sub">Wie Milli bei Division und Multiplikation steht.</p>
      </div>
      <div style="text-align:right;">
        <span class="refresh-link" onclick="loadDashboardData()">Jetzt aktualisieren</span>
        <span class="refresh-link" onclick="downloadResultsCSV()" style="margin-left:14px;">⬇ Ergebnisse herunterladen</span>
        <div id="auto-refresh-note" style="font-size:.72rem; color:var(--text-secondary); margin-top:2px;"></div>
      </div>
    </div>

    <div id="dashboard-content"><!-- wird dynamisch gefüllt --></div>
  </div>

</div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
/* ---------- Login (Supabase Auth) + PIN Gate ---------- */
const PIN_SESSION_KEY = 'milliDashboardUnlocked';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function handleFamilyLogin(){
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = 'Prüfe...';
  const { error } = await familySignIn(username, password);
  if(error){
    errorEl.textContent = 'Anmeldung fehlgeschlagen. Bitte nochmal versuchen.';
    return;
  }
  errorEl.textContent = ' ';
  afterLogin();
}

function afterLogin(){
  if(sessionStorage.getItem(PIN_SESSION_KEY) === '1'){
    unlockDashboard();
  } else {
    showScreen('screen-pin');
  }
}

function checkPin(){
  const input = document.getElementById('pin-input');
  const pin = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.PARENT_PIN) || '1234';
  if(input.value === pin){
    sessionStorage.setItem(PIN_SESSION_KEY, '1');
    unlockDashboard();
  } else {
    document.getElementById('pin-error').textContent = 'Falscher PIN – versuch es nochmal.';
    input.value = '';
  }
}

function unlockDashboard(){
  showScreen('screen-dashboard');
  loadDashboardData();
  startAutoRefresh();
}

// Holt automatisch neue Ergebnisse nach, solange das Dashboard offen ist -
// damit man den Lernfortschritt live verfolgen kann, ohne selbst auf
// "Aktualisieren" klicken zu müssen.
const AUTO_REFRESH_SECONDS = 30;
let autoRefreshTimer = null;

function startAutoRefresh(){
  if(autoRefreshTimer) return;
  autoRefreshTimer = setInterval(()=>{
    if(document.getElementById('screen-dashboard').classList.contains('active')){
      loadDashboardData();
    }
  }, AUTO_REFRESH_SECONDS * 1000);
}

function updateAutoRefreshNote(){
  const el = document.getElementById('auto-refresh-note');
  if(!el) return;
  const timeStr = new Date().toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  el.textContent = `Zuletzt aktualisiert: ${timeStr} · alle ${AUTO_REFRESH_SECONDS}s automatisch`;
}

document.addEventListener('DOMContentLoaded', async ()=>{
  document.getElementById('login-password').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleFamilyLogin();
  });
  document.getElementById('pin-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') checkPin();
  });

  if(!supabaseConfigured()){
    showScreen('screen-dashboard');
    loadDashboardData();
    return;
  }
  const loggedIn = await familyHasSession();
  if(loggedIn){
    afterLogin();
  }
});

/* ---------- Datenabruf ---------- */
let activeTab = 'division';
let lastLog = [];

async function loadDashboardData(){
  const content = document.getElementById('dashboard-content');
  content.innerHTML = '<p class="sub">Lade Daten…</p>';

  const sb = getSupabaseClient();
  if(!sb){
    content.innerHTML = `
      <div class="empty-state">
        <div style="font-size:40px;">🔌</div>
        <h2>Noch keine Datenbank verbunden</h2>
        <p>Trage deine Supabase-Zugangsdaten in <code>config.js</code> ein (siehe README.md),
        damit hier die Auswertung von den Übungsergebnissen erscheint.</p>
      </div>`;
    return;
  }

  try{
    const [{ data: factRows, error: e1 }, { data: log, error: e2 }, { data: progressRows, error: e3 }] = await Promise.all([
      sb.from('facts').select('*'),
      sb.from('answer_log').select('*').order('created_at', { ascending:true }),
      sb.from('progress').select('*').eq('id', true).limit(1)
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    if(e3) throw e3;
    hydrateStateFromRows(factRows||[], (progressRows&&progressRows[0])||null);
    lastLog = log||[];
    renderDashboard();
    updateAutoRefreshNote();
  }catch(err){
    content.innerHTML = `
      <div class="empty-state">
        <div style="font-size:40px;">⚠️</div>
        <h2>Daten konnten nicht geladen werden</h2>
        <p>${(err&&err.message)||'Unbekannter Fehler'}</p>
      </div>`;
    updateAutoRefreshNote();
  }
}

// Befüllt das globale `state` (aus shared.js) mit den geladenen Zeilen, damit
// dieselben Hilfsfunktionen wie im Spiel (getFact, currentPackageNumber, ...)
// hier direkt wiederverwendet werden können.
function hydrateStateFromRows(factRows, progressRow){
  state = defaultState();
  factRows.forEach(r=>{
    if(!state.subjects[r.subject]) return;
    state.subjects[r.subject].facts[factKey(r.reihe, r.position)] = {
      box:r.box, correct:r.correct_count, wrong:r.wrong_count, skip:r.skip_count||0, seen:r.seen
    };
  });
  if(progressRow){
    SUBJECTS.forEach(s=>{
      if(progressRow.packages && progressRow.packages[s]) state.subjects[s].packages = progressRow.packages[s];
    });
    state.score = progressRow.score || 0;
    state.bestStreak = progressRow.best_streak || 0;
  }
}

/* ---------- Auswertung & Rendering ---------- */
function renderDashboard(){
  const content = document.getElementById('dashboard-content');
  const anyFacts = SUBJECTS.some(s=>Object.keys(state.subjects[s].facts).length>0);

  if(!anyFacts && lastLog.length === 0){
    content.innerHTML = `
      <div class="empty-state">
        <div style="font-size:40px;">🐯</div>
        <h2>Noch keine Übungsdaten</h2>
        <p>Sobald Milli im Spiel ein paar Aufgaben löst, erscheint hier die Auswertung.</p>
      </div>`;
    return;
  }

  content.innerHTML = `
    ${compactSummaryHTML()}
    <div class="tabs">
      <button class="tab-btn ${activeTab==='division'?'active':''}" onclick="switchTab('division')">➗ Division</button>
      <button class="tab-btn ${activeTab==='multiplication'?'active':''}" onclick="switchTab('multiplication')">✖️ Multiplikation</button>
    </div>
    <div id="subject-content"></div>
  `;
  renderSubjectSection(activeTab);
}

function switchTab(subject){
  activeTab = subject;
  renderDashboard();
}

function compactSummaryHTML(){
  let totalCorrect=0, totalWrong=0;
  const perSubjectSummary = SUBJECTS.map(s=>{
    const facts = allFactsList(s);
    const correct = facts.reduce((sum,t)=>sum+t.fact.correct,0);
    const wrong = facts.reduce((sum,t)=>sum+t.fact.wrong,0);
    totalCorrect += correct; totalWrong += wrong;
    const flagged = facts.filter(t=>isFlagged(t.fact)).length;
    return { subject:s, paket: currentPackageNumber(s), stars: totalStars(s), flagged };
  });
  const totalAttempts = totalCorrect+totalWrong;
  const accuracy = totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : null;
  const days = new Set(lastLog.map(r=>(r.created_at||'').slice(0,10)).filter(Boolean)).size;

  return `
    <div class="summary-card">
      <h2>Auf einen Blick</h2>
      <div class="summary-grid">
        <div class="summary-tile"><b>${accuracy===null?'–':accuracy+'%'}</b><span>Trefferquote gesamt</span></div>
        <div class="summary-tile"><b>${days}</b><span>Übungstage insgesamt</span></div>
        <div class="summary-tile"><b>${state.score}</b><span>Punkte gesamt</span></div>
        ${perSubjectSummary.map(p=>`
          <div class="summary-tile"><b>Paket ${p.paket}</b><span>${SUBJECT_LABELS[p.subject]} · ${p.stars} ⭐${p.flagged?` · ${p.flagged} zu wiederholen`:''}</span></div>
        `).join('')}
      </div>
    </div>
  `;
}

function allFactsList(subject){
  const list = [];
  for(let r=1;r<=12;r++){
    for(let p=1;p<=12;p++){
      const f = getFact(subject, r, p);
      if(f.seen) list.push(Object.assign(makeTask(subject, r, p), { fact:f }));
    }
  }
  return list;
}

// Baut den CSV-Text aus allen geübten Aufgaben (beide Fächer) - als reine
// Funktion ohne DOM-Nebenwirkungen, damit sie sich einfach testen lässt.
function buildResultsCSVString(){
  const rows = [['Fach','Reihe','Aufgabe','Ergebnis','Box-Stufe','Richtig','Falsch','Übersprungen']];
  SUBJECTS.forEach(subject=>{
    allFactsList(subject).forEach(t=>{
      rows.push([
        SUBJECT_LABELS[subject],
        t.reihe,
        t.promptText.replace(/\s*=\s*$/, ''),
        t.answer,
        t.fact.box,
        t.fact.correct,
        t.fact.wrong,
        t.fact.skip
      ]);
    });
  });
  return rows.map(row => row.map(cell => {
    const s = String(cell);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}

// Exportiert die Ergebnisse als CSV-Datei, damit sie offline gespeichert
// oder z.B. mit der Lehrkraft geteilt werden können (Excel/Numbers-kompatibel).
function downloadResultsCSV(){
  const csv = buildResultsCSVString();
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `milli-ergebnisse-${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function computePerReiheErrorRates(subject){
  const rows = [];
  for(let r=1; r<=12; r++){
    let correct=0, wrong=0;
    for(let p=1;p<=12;p++){
      const f = getFact(subject, r, p);
      correct += f.correct||0; wrong += f.wrong||0;
    }
    const attempts = correct+wrong;
    rows.push({ reihe:r, attempts, errorRate: attempts ? wrong/attempts : null });
  }
  return rows;
}

function computeWeakestFacts(subject, limit){
  return allFactsList(subject)
    .filter(t=>t.fact.wrong>0)
    .sort((a,b)=>{
      const rateA = a.fact.wrong/(a.fact.wrong+a.fact.correct||1);
      const rateB = b.fact.wrong/(b.fact.wrong+b.fact.correct||1);
      return (rateB-rateA) || (b.fact.wrong-a.fact.wrong);
    })
    .slice(0, limit);
}

function computeOftenSkipped(subject, limit){
  return allFactsList(subject)
    .filter(t=>t.fact.skip >= SKIP_FLAG_THRESHOLD)
    .sort((a,b)=>b.fact.skip - a.fact.skip)
    .slice(0, limit);
}

function computeAccuracyTrend(subject){
  const filtered = lastLog.filter(r=>r.subject===subject && !r.skipped);
  const byDay = {};
  filtered.forEach(r=>{
    const day = (r.created_at||'').slice(0,10);
    if(!day) return;
    if(!byDay[day]) byDay[day] = { correct:0, total:0 };
    byDay[day].total++;
    if(r.correct) byDay[day].correct++;
  });
  return Object.keys(byDay).sort().map(day=>({
    day, accuracy: Math.round((byDay[day].correct/byDay[day].total)*100), total: byDay[day].total
  }));
}

function computeInsights(subject){
  const insights = [];
  const log = lastLog.filter(r=>r.subject===subject && !r.skipped);

  const tally = {}, example = {};
  log.forEach(r=>{
    if(r.correct) return;
    const cat = classifyMistake(r);
    if(!cat) return;
    tally[cat] = (tally[cat]||0) + 1;
    if(!example[cat]) example[cat] = r;
  });
  Object.keys(tally).sort((a,b)=>tally[b]-tally[a]).slice(0,2).forEach(cat=>{
    if(tally[cat] < 2) return;
    const label = MISTAKE_LABELS[cat] || MISTAKE_LABELS.sonstige;
    insights.push({ title: `${label.title} (${tally[cat]}×)`, detail: label.detail(example[cat]) });
  });

  let lowC=0, lowW=0, highC=0, highW=0;
  allFactsList(subject).forEach(t=>{
    if(t.position<=6){ lowC+=t.fact.correct; lowW+=t.fact.wrong; }
    else { highC+=t.fact.correct; highW+=t.fact.wrong; }
  });
  const lowAttempts=lowC+lowW, highAttempts=highC+highW;
  if(lowAttempts>=8 && highAttempts>=8){
    const lowRate=lowW/lowAttempts, highRate=highW/highAttempts;
    if(Math.abs(highRate-lowRate)>=0.12){
      const harder = highRate>lowRate ? 'größeren' : 'kleineren';
      const easier = highRate>lowRate ? 'kleineren' : 'größeren';
      const harderPct = Math.round(Math.max(highRate,lowRate)*100);
      const easierPct = Math.round(Math.min(highRate,lowRate)*100);
      insights.push({
        title: `Tut sich bei ${harder} Ergebnissen schwerer`,
        detail: `Bei Ergebnissen ${harder==='größeren'?'ab 7':'bis 6'} liegt die Fehlerquote bei ${harderPct}%, bei ${easier==='größeren'?'ab 7':'bis 6'} nur bei ${easierPct}%.`
      });
    }
  }
  const skipCount = allFactsList(subject).reduce((s,t)=>s+t.fact.skip,0);
  if(skipCount >= 5){
    insights.push({
      title: `Überspringt öfter Aufgaben (${skipCount}×)`,
      detail: 'Häufiges Überspringen kann auf Unsicherheit hindeuten, auch wenn die Aufgabe später richtig gelöst wird - ein Blick auf die "oft übersprungen"-Liste unten lohnt sich.'
    });
  }
  return insights;
}

function renderSubjectSection(subject){
  const wrap = document.getElementById('subject-content');
  const facts = allFactsList(subject);
  const totalCorrect = facts.reduce((s,t)=>s+t.fact.correct,0);
  const totalWrong = facts.reduce((s,t)=>s+t.fact.wrong,0);
  const totalAttempts = totalCorrect+totalWrong;
  const accuracy = totalAttempts ? Math.round((totalCorrect/totalAttempts)*100) : null;
  const masteredCount = facts.filter(t=>t.fact.box>=3).length;

  const perReihe = computePerReiheErrorRates(subject);
  const weakest = computeWeakestFacts(subject, 8);
  const oftenSkipped = computeOftenSkipped(subject, 8);
  const trend = computeAccuracyTrend(subject);
  const insights = computeInsights(subject);
  const sym = subjectSymbol(subject);

  wrap.innerHTML = `
    <div class="stat-grid">
      <div class="stat-tile"><b>${facts.length}</b><span>Aufgaben geübt</span></div>
      <div class="stat-tile"><b>${accuracy===null?'–':accuracy+'%'}</b><span>Trefferquote</span></div>
      <div class="stat-tile"><b>${masteredCount}</b><span>sicher gemeistert</span></div>
      <div class="stat-tile"><b>Paket ${currentPackageNumber(subject)}</b><span>aktueller Stand</span></div>
    </div>

    <div class="card">
      <h2>Fehlerquote je Reihe</h2>
      <p class="sub" style="margin-bottom:12px;">Zeigt, bei welcher Reihe (${sym}1 bis ${sym}12) tendenziell die meisten Fehler passieren.</p>
      <div class="chart-wrap" id="bar-chart"></div>
      ${tableToggle('Reihen-Tabelle anzeigen', perReiheTableHTML(perReihe, sym))}
    </div>

    <div class="card">
      <h2>Trefferquote über die Zeit</h2>
      <p class="sub" style="margin-bottom:12px;">Die komplette Übungshistorie, damit du die Entwicklung erkennen kannst.</p>
      <div class="chart-wrap" id="line-chart"></div>
      ${tableToggle('Tages-Tabelle anzeigen', trendTableHTML(trend))}
    </div>

    <div class="card">
      <h2>Diese Aufgaben bereiten am meisten Mühe</h2>
      ${weakest.length ? `<ul class="weak-list">${weakest.map(t=>`
        <li><span>${t.promptText} ${t.answer}</span>
        <span class="pct">${t.fact.wrong} von ${t.fact.wrong+t.fact.correct} falsch</span></li>`).join('')}</ul>`
        : '<p class="sub">Bisher keine auffälligen Aufgaben – weiter so!</p>'}
    </div>

    <div class="card">
      <h2>Oft übersprungen</h2>
      ${oftenSkipped.length ? `<ul class="weak-list">${oftenSkipped.map(t=>`
        <li><span>${t.promptText} ${t.answer}</span>
        <span class="pct skip">${t.fact.skip}× übersprungen</span></li>`).join('')}</ul>`
        : '<p class="sub">Bisher keine Aufgabe auffällig oft übersprungen.</p>'}
    </div>

    <div class="insight-box">
      <h2>🔍 Was auffällt</h2>
      ${insights.length ? insights.map(i=>`
        <div class="insight-item">
          <div class="title">${i.title}</div>
          <div class="detail">${i.detail}</div>
        </div>`).join('') : '<p class="sub">Noch nicht genug Daten für ein klares Muster – nach ein paar weiteren Übungsrunden zeigt sich hier mehr.</p>'}
    </div>
  `;

  renderBarChart(document.getElementById('bar-chart'), perReihe, sym);
  renderLineChart(document.getElementById('line-chart'), trend);
}

function tableToggle(label, tableHtml){
  return `<details class="table-toggle"><summary>${label}</summary>${tableHtml}</details>`;
}

function perReiheTableHTML(perReihe, sym){
  return `<table class="data-table"><thead><tr><th>Reihe</th><th>Versuche</th><th>Fehlerquote</th></tr></thead><tbody>
    ${perReihe.map(t=>`<tr><td>${sym}${t.reihe}</td><td>${t.attempts}</td><td>${t.errorRate===null?'–':Math.round(t.errorRate*100)+'%'}</td></tr>`).join('')}
  </tbody></table>`;
}
function trendTableHTML(trend){
  if(!trend.length) return '<p class="sub">Noch keine Tage mit Übungsdaten.</p>';
  return `<table class="data-table"><thead><tr><th>Datum</th><th>Trefferquote</th><th>Aufgaben</th></tr></thead><tbody>
    ${trend.map(t=>`<tr><td>${t.day}</td><td>${t.accuracy}%</td><td>${t.total}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- SVG: Balkendiagramm (Fehlerquote je Reihe) ---------- */
function statusColorForRate(rate){
  if(rate === null) return 'var(--nodata)';
  if(rate < 0.10) return 'var(--good)';
  if(rate < 0.25) return 'var(--warning)';
  return 'var(--critical)';
}

function renderBarChart(container, perReihe, sym){
  const w = Math.max(container.clientWidth || 640, 320);
  const h = 220;
  const padL = 30, padR = 10, padT = 20, padB = 28;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = perReihe.length;
  const gap = 8;
  const barW = (plotW - gap*(n-1)) / n;

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Fehlerquote je Reihe">`;

  [0,25,50,75,100].forEach(pct=>{
    const y = padT + plotH - (pct/100)*plotH;
    svg += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"/>`;
  });

  perReihe.forEach((t,i)=>{
    const x = padL + i*(barW+gap);
    const rate = t.errorRate === null ? 0 : t.errorRate;
    const barH = t.errorRate === null ? 4 : Math.max(2, rate*plotH);
    const y = padT + plotH - barH;
    const color = statusColorForRate(t.errorRate);
    const label = t.errorRate === null ? '–' : Math.round(t.errorRate*100)+'%';
    svg += `<rect class="bar-rect" x="${x}" y="${y}" width="${barW}" height="${barH}" rx="4" fill="${color}"
      data-tip="${sym}${t.reihe}: ${label} Fehler (${t.attempts} Versuche)"/>`;
    svg += `<text class="value-label" x="${x+barW/2}" y="${y-6}" text-anchor="middle">${label}</text>`;
    svg += `<text class="axis-label" x="${x+barW/2}" y="${h-8}" text-anchor="middle">${sym}${t.reihe}</text>`;
  });

  svg += `<line class="baseline" x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}"/>`;
  svg += `</svg>`;
  container.innerHTML = svg;
  attachBarTooltips(container);
}

function attachBarTooltips(container){
  const tooltip = document.getElementById('tooltip');
  container.querySelectorAll('.bar-rect').forEach(rect=>{
    rect.addEventListener('mousemove', (e)=>{
      tooltip.textContent = rect.dataset.tip;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + window.scrollY + 'px';
      tooltip.style.opacity = '1';
    });
    rect.addEventListener('mouseleave', ()=>{ tooltip.style.opacity = '0'; });
  });
}

/* ---------- SVG: Linienchart (Genauigkeit über Zeit) ---------- */
function renderLineChart(container, trend){
  if(!trend.length){
    container.innerHTML = '<p class="sub">Noch keine Tage mit Übungsdaten.</p>';
    return;
  }
  const w = Math.max(container.clientWidth || 640, 320);
  const h = 220;
  const padL = 34, padR = 16, padT = 20, padB = 28;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const n = trend.length;
  const stepX = n > 1 ? plotW/(n-1) : 0;

  const points = trend.map((t,i)=>({
    x: padL + i*stepX,
    y: padT + plotH - (t.accuracy/100)*plotH,
    ...t
  }));

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Genauigkeit über Zeit">`;
  [0,25,50,75,100].forEach(pct=>{
    const y = padT + plotH - (pct/100)*plotH;
    svg += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"/>`;
    svg += `<text class="axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${pct}%</text>`;
  });

  const path = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  svg += `<path d="${path}" fill="none" stroke="var(--seq-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;

  const labelEvery = Math.max(1, Math.ceil(n/7));
  points.forEach((p,i)=>{
    svg += `<circle class="trend-point" cx="${p.x}" cy="${p.y}" r="4" fill="var(--seq-blue)" stroke="var(--surface-1)" stroke-width="2"
      data-tip="${formatDay(p.day)}: ${p.accuracy}% (${p.total} Aufgaben)"/>`;
    if(i===0 || i===points.length-1 || i%labelEvery===0){
      svg += `<text class="axis-label" x="${p.x}" y="${h-8}" text-anchor="middle">${formatDay(p.day)}</text>`;
    }
  });

  svg += `<line class="baseline" x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}"/>`;
  svg += `</svg>`;
  container.innerHTML = svg;
  attachLineTooltips(container);
}

function formatDay(iso){
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.`;
}

function attachLineTooltips(container){
  const tooltip = document.getElementById('tooltip');
  container.querySelectorAll('.trend-point').forEach(pt=>{
    pt.addEventListener('mousemove', (e)=>{
      tooltip.textContent = pt.dataset.tip;
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + window.scrollY + 'px';
      tooltip.style.opacity = '1';
    });
    pt.addEventListener('mouseleave', ()=>{ tooltip.style.opacity = '0'; });
  });
}
</script>
</body>
</html>
